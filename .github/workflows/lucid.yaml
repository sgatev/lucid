name: lucid

on: [push]

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Use the Command Line Tools toolchain
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: Run tests
        run: bazel test ...
      - name: Run tests in opt mode
        run: bazel test -c opt ...
      - name: Run tests in ASan mode
        run: bazel test --config=asan ...
      - name: Run tests in UBSan mode
        run: bazel test --config=ubsan ...

  benchmark:
    needs: test
    runs-on: xcode-27
    permissions:
      # The results of a run on main are pushed to the gh-pages branch.
      contents: write
    # Two runs that both push to gh-pages would race, so they are serialized
    # rather than cancelled.
    concurrency:
      group: benchmark-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Use the Command Line Tools toolchain
        run: sudo xcode-select -s /Library/Developer/CommandLineTools
      - name: Run benchmarks
        run: scripts/run_benchmarks.sh > benchmarks.json
      - name: Publish the page the results are read on
        if: github.ref == 'refs/heads/main'
        run: scripts/publish_benchmark_page.sh
      - name: Record the results
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Lucid benchmarks
          tool: customSmallerIsBetter
          output-file-path: benchmarks.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          # A benchmark measures wall time, which moves from run to run even
          # when nothing about the code has. The threshold starts well above
          # that noise and is worth tightening once the chart shows how much
          # of it this runner actually has.
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
