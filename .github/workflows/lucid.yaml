name: lucid

on: [push]

jobs:
  test:
    runs-on: macos-latest-xlarge
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bazel test ...
      - name: Run benchmarks
        run: |
          bazel run -c opt //lucid:lexer_bench
          bazel run -c opt //lucid:parser_bench
